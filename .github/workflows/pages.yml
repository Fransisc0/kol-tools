name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      should_deploy: ${{ steps.deployment-check.outputs.should_deploy }}
    steps:
      - name: Check out kol-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out current KoLmafia inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kolmafia/kolmafia
          ref: main
          path: .upstream/kolmafia
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/data/tcrs.txt
            /src/data/items.txt
            /src/data/modifiers.txt
            /src/data/npcstores.txt
            /src/data/coinmasters.txt
            /src/data/concoctions.txt
            /src/data/combats.txt
            /src/data/monsters.txt
            /src/data/cafe_food.txt
            /src/data/cafe_booze.txt
            /src/data/fullness.txt
            /src/data/inebriety.txt
            /src/net/sourceforge/kolmafia/persistence/TCRSDatabase.java
            /src/net/sourceforge/kolmafia/objectpool/ItemPool.java
            /src/net/sourceforge/kolmafia/objectpool/EffectPool.java
            /src/net/sourceforge/kolmafia/modifiers/DoubleModifier.java
            /src/net/sourceforge/kolmafia/modifiers/BooleanModifier.java
            /src/net/sourceforge/kolmafia/modifiers/StringModifier.java
            /src/net/sourceforge/kolmafia/utilities/PHPMTRandom.java
            /src/net/sourceforge/kolmafia/utilities/PHPRandom.java
            /src/net/sourceforge/kolmafia/utilities/PHPRandomSelection.java
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify application code and dependencies
        run: npm run verify:code
      - name: Download current Data of Loathing database
        run: npm run data:download
      - name: Check reviewed algorithm and input fingerprint
        id: deployment-check
        run: npm run data:check
      - name: Build generated Pages artifact
        if: steps.deployment-check.outputs.should_deploy == 'true'
        run: npm run build:staged
      - name: Verify generated Pages artifact
        if: steps.deployment-check.outputs.should_deploy == 'true'
        run: |
          npm run verify:data-determinism -- --kolmafia-root .upstream/kolmafia --dol-database .staged-data/dol.sqlite --dol-etag-file .staged-data/dol.etag
          npm run verify:pages
          npm run verify:privacy
      - name: Configure GitHub Pages
        if: steps.deployment-check.outputs.should_deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        if: steps.deployment-check.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages
          retention-days: 1

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
