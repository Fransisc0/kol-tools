services:
  - type: web
    name: fransisc0-kol-tools-tcrs-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run typecheck && npm test && npm run clean && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://fransisc0.github.io
      - key: SERVE_CLIENT
        value: 'false'
